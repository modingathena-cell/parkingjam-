<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parking Jam – Jeu de puzzle gratuit</title>
<meta name="description" content="Libère toutes les voitures du parking ! Un jeu de réflexion gratuit, niveaux infinis.">

<style>
:root{--bg:#eef3ff;--fg:#1d2540;--card:#fff;--accent:#2a62d9;--line:#cfd8f0}
@media (prefers-color-scheme:dark){:root{--bg:#141a2e;--fg:#eaf0ff;--card:#1f2742;--accent:#5b8cff;--line:#334066}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px 10px 20px}
h1{font-size:20px;margin:6px 0}
.ad{width:100%;max-width:480px;min-height:60px;margin:6px 0;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.7;overflow:hidden}
.bar{display:flex;gap:8px;width:100%;max-width:480px;justify-content:space-between;align-items:center;margin:6px 0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:20px;padding:9px 16px;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#wrap{width:min(94vw,480px);aspect-ratio:1;position:relative}
#board{position:absolute;inset:0;background:var(--card);border:3px solid var(--line);border-radius:14px;overflow:hidden;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px)}
.car{position:absolute;padding:5%;transition:transform .55s cubic-bezier(.5,0,.9,.5),opacity .55s;cursor:pointer}
.car i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:22%;color:#fff;font-style:normal;
 font-size:clamp(14px,5vw,26px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 2px 4px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.car.out{opacity:0;pointer-events:none}
.car.bad i{animation:sh .35s;outline:3px solid #ff3b3b}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#modal{position:fixed;inset:0;background:rgba(10,15,35,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal div{background:var(--card);padding:24px;border-radius:18px;text-align:center;max-width:300px}
#modal h2{margin:0 0 6px}
.bar button{padding:7px 11px;font-size:13px}
.foot{font-size:11px;opacity:.6;margin-top:10px;text-align:center}
.foot a{color:inherit}
</style>
</head>
<body>
<h1>🚗 Parking Jam</h1>

<!-- Bannière AdSense haut -->
<div class="ad" id="adTop">
  <!-- <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script> -->
  Espace publicitaire
</div>

<div class="bar">
  <span class="pill" id="lvl">Niveau 1</span>
  <span class="pill" id="mv">Coups : 0</span>
  <span class="pill" id="tm" style="display:none">⏱ 0</span>
  <button class="sec" id="rs">↺</button>
</div>

<div class="bar">
  <button class="sec" id="mode">⏱ Contre-la-montre : OFF</button>
  <button class="sec" id="skinBtn">🎨 Classique</button>
  <button class="sec" id="snd">🔊</button>
</div>

<div id="wrap"><div id="board"></div></div>

<div class="bar">
  <button class="sec" id="hint">💡 Indice</button>
  <button id="skip" class="sec">Passer ➜</button>
</div>

<!-- Bannière AdSense bas -->
<div class="ad" id="adBot">
  <!-- <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script> -->
  Espace publicitaire
</div>

<p class="foot">Touche une voiture pour la faire sortir dans le sens de la flèche. Libère tout le parking !<br>
<a href="/confidentialite.html">Politique de confidentialité</a></p>

<div id="modal"><div>
  <h2 id="mt">🎉 Bravo !</h2>
  <p id="mtxt"></p>
  <button id="next">Niveau suivant</button>
</div></div>

<script>
const COLORS=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#d81b60','#6d4c41','#00897b'];
const board=document.getElementById('board');
const PALS={
 'Classique':COLORS,
 'Pastel':['#ff9aa2','#ffb347','#e6d84f','#7fd6b0','#7cc4ff','#aab4e8','#d9a0f0','#f59cc0','#cfae95','#6fd6d3'],
 'Néon':['#ff2e63','#ff9f1c','#d4ec00','#2bd60f','#00d9bd','#00bbf9','#9b5de5','#f15bb5','#ff6d00','#08c9d6'],
 'Océan':['#03045e','#0077b6','#00a6c7','#2fb5d8','#023e8a','#0096c7','#5390d9','#4ea8de','#6930c3','#3fc2c2']};
let N=6,cars=[],level=1,moves=0,seed=1,busy=false;
let skin='Classique',timed=false,mute=false,left=0,tmr=null,lost=false,ac;
try{skin=localStorage.getItem('pj_skin')||skin;if(!PALS[skin])skin='Classique';timed=localStorage.getItem('pj_timed')==='1';mute=localStorage.getItem('pj_mute')==='1'}catch(e){}
function beep(f,d,t,v,delay){if(mute)return;setTimeout(()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}},delay||0)}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}

try{level=parseInt(localStorage.getItem('pj_level'))||1}catch(e){}

function rng(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function ri(a,b){return a+Math.floor(rng()*(b-a+1))}

function cells(c){const o=[];for(let i=0;i<c.len;i++)o.push(c.h?[c.x+i,c.y]:[c.x,c.y+i]);return o}
function occ(list,ignore){const m=new Set();list.forEach(c=>{if(c!==ignore)cells(c).forEach(p=>m.add(p[0]+','+p[1]))});return m}
function pathFree(c,list){
  const m=occ(list,c);
  if(c.h){const r=c.s>0?[c.x+c.len,N-1]:[0,c.x-1];for(let x=r[0];x<=r[1];x++)if(m.has(x+','+c.y))return false}
  else{const r=c.s>0?[c.y+c.len,N-1]:[0,c.y-1];for(let y=r[0];y<=r[1];y++)if(m.has(c.x+','+y))return false}
  return true;
}

function generate(){
  seed=level*7919+13;
  N=Math.min(8,5+Math.floor((level-1)/4));
  const target=Math.min(Math.floor(N*N*.55),4+level*2);
  const list=[];let tries=0;
  while(list.length<target&&tries++<1500){
    const h=rng()<.5,len=rng()<.7?2:3;
    const c={h,len,s:rng()<.5?1:-1,x:ri(0,h?N-len:N-1),y:ri(0,h?N-1:N-len),ci:list.length%10};
    const m=occ(list);
    if(cells(c).some(p=>m.has(p[0]+','+p[1])))continue;
    if(!pathFree(c,list))continue; // garantit que le niveau est toujours solvable
    list.push(c);
  }
  cars=list;
}

function render(){
  board.innerHTML='';
  board.style.backgroundSize=(100/N)+'% '+(100/N)+'%';
  cars.forEach(c=>{
    const d=document.createElement('div');d.className='car';
    const k=100/N;
    d.style.left=c.x*k+'%';d.style.top=c.y*k+'%';
    d.style.width=(c.h?c.len:1)*k+'%';d.style.height=(c.h?1:c.len)*k+'%';
    const rot=c.h?(c.s>0?0:180):(c.s>0?90:270);
    d.innerHTML='<i style="background:'+PALS[skin][c.ci]+'"><span style="display:inline-block;transform:rotate('+rot+'deg)">➤</span></i>';
    d.onclick=()=>tap(c,d);
    c.el=d;board.appendChild(d);
  });
  document.getElementById('lvl').textContent='Niveau '+level;
  document.getElementById('mv').textContent='Coups : '+moves;
}

function tap(c,d){
  if(busy||!cars.includes(c))return;
  moves++;document.getElementById('mv').textContent='Coups : '+moves;
  if(pathFree(c,cars)){
    beep(480,.12,'triangle');beep(720,.18,'triangle',.12,90);
    cars=cars.filter(x=>x!==c);
    const dist=(N+c.len)/c.len*100*c.s;
    d.style.transform=c.h?'translateX('+dist+'%)':'translateY('+dist+'%)';
    d.classList.add('out');
    setTimeout(()=>d.remove(),600);
    if(!cars.length){busy=true;setTimeout(win,700)}
  }else{
    d.classList.remove('bad');void d.offsetWidth;d.classList.add('bad');
    setTimeout(()=>d.classList.remove('bad'),400);
    beep(140,.22,'square',.08);
    if(navigator.vibrate)navigator.vibrate(40);
  }
}

function stopTimer(){clearInterval(tmr);tmr=null}
function show(title,txt,btn){document.getElementById('mt').textContent=title;document.getElementById('mtxt').textContent=txt;document.getElementById('next').textContent=btn;document.getElementById('modal').style.display='flex'}
function win(){
  stopTimer();lost=false;
  [523,659,784,1047].forEach((f,k)=>beep(f,.25,'triangle',.12,k*110));
  show('🎉 Bravo !','Niveau '+level+' terminé en '+moves+' coups'+(timed?' – il restait '+left+' s.':'.'),'Niveau suivant');
  // Bon endroit pour rafraîchir une pub entre deux niveaux
}
function lose(){
  stopTimer();busy=true;lost=true;
  [330,262,196].forEach((f,k)=>beep(f,.3,'sawtooth',.08,k*150));
  show('⏰ Temps écoulé !','Il reste '+cars.length+' voiture(s). Réessaie le niveau '+level+' !','Réessayer');
}
function tick(){
  left--;updTimer();
  if(left<=5&&left>0)beep(900,.08,'square',.05);
  if(left<=0)lose();
}
function updTimer(){const t=document.getElementById('tm');t.textContent='⏱ '+left+' s';t.style.color=left<=10?'#ff3b3b':''}
function uiModes(){
  document.getElementById('mode').textContent='⏱ Contre-la-montre : '+(timed?'ON':'OFF');
  document.getElementById('skinBtn').textContent='🎨 '+skin;
  document.getElementById('snd').textContent=mute?'🔇':'🔊';
  document.getElementById('tm').style.display=timed?'':'none';
}
function start(){
  stopTimer();busy=false;lost=false;moves=0;generate();render();uiModes();
  if(timed){left=20+cars.length*4;updTimer();tmr=setInterval(tick,1000)}
  try{localStorage.setItem('pj_level',level)}catch(e){}
}
document.getElementById('next').onclick=()=>{document.getElementById('modal').style.display='none';if(!lost)level++;start()};
document.getElementById('mode').onclick=()=>{timed=!timed;save('pj_timed',timed?'1':'0');start()};
document.getElementById('skinBtn').onclick=()=>{const k=Object.keys(PALS);skin=k[(k.indexOf(skin)+1)%k.length];save('pj_skin',skin);uiModes();render()};
document.getElementById('snd').onclick=()=>{mute=!mute;save('pj_mute',mute?'1':'0');uiModes();beep(600,.1)};
document.getElementById('rs').onclick=start;
document.getElementById('skip').onclick=()=>{level++;start()};
document.getElementById('hint').onclick=()=>{
  const c=cars.find(x=>pathFree(x,cars));
  if(c){c.el.style.filter='brightness(1.4)';setTimeout(()=>c.el.style.filter='',900)}
};
start();
</script>
</body>
</html>
